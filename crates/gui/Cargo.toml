[package]
name = "deepwork"
description = "DeepWork: a website and app blocker for Linux with a GTK4 / libadwaita interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
async-channel = "2.5.0"
deepwork-core.workspace = true
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
pangocairo = "0.22.9"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
glib-build-tools = "0.22.8"
