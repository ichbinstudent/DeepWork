[package]
name = "deepwork"
description = "DeepWork: a website and app blocker for Linux and Windows with a GTK4 / libadwaita interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
async-channel = "2.5.0"
deepwork-core.workspace = true
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
pangocairo = "0.22.9"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
glib-build-tools = "0.22.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
