[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/gui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/ichbinstudent/deepwork"
homepage = "https://github.com/ichbinstudent/deepwork"
publish = false

[workspace.dependencies]
deepwork-core = { path = "crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
# Line tables so crash reports can be read. The packages strip the programs
# and publish the debug information separately (.debug files, PDBs).
debug = "line-tables-only"
