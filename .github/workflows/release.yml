name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build the
# packages and create a draft release. Running it by hand only builds them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    # Debian 13 has the oldest glibc, GTK and libadwaita that DeepWork
    # supports, so the binaries also run on every newer distribution.
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev-bin curl ca-certificates git python3 \
            binutils
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $v in Cargo.toml" >&2
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build
        run: rustup toolchain install && cargo build --release --locked
      - name: Package
        env:
          PACKAGE_MAINTAINER: ${{ vars.PACKAGE_MAINTAINER }}
        run: .github/scripts/package-linux.sh target/release dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x86_64
          path: dist

  # The GTK app, built natively with MSYS2 for each architecture.
  windows-app:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: UCRT64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            cc:p pkgconf:p rust:p gtk4:p libadwaita:p librsvg:p adwaita-icon-theme:p
      - name: Build and bundle the app
        shell: msys2 {0}
        run: |
          cargo build --release --locked -p deepwork
          .github/scripts/bundle-windows-app.sh app-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gtk-app-${{ matrix.arch }}
          path: |
            app-bundle
            app-bundle-symbols

  # The service and deepworkctl for each architecture, plus the app.
  windows:
    needs: windows-app
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p deepwork-daemon --target ${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gtk-app-${{ matrix.arch }}
      - name: Build the installer
        shell: pwsh
        run: ./.github/scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Bin target/${{ matrix.target }}/release -App app-bundle -Out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*-symbols.zip

  # The exact files to be published, tested end to end on clean systems.
  test-linux:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            package: "*.deb"
          - image: fedora:42
            package: "*.rpm"
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-x86_64
          path: dist
      - name: Test the package
        run: .github/scripts/linux-package-test.sh dist/${{ matrix.package }}

  test-windows:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist
      - name: End-to-end test
        shell: pwsh
        run: ./.github/scripts/windows-e2e.ps1 -Setup (Get-Item dist/*-setup.exe).FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-e2e-${{ matrix.arch }}
          path: ${{ runner.temp }}/shots

  release:
    needs: [linux, windows, test-linux, test-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The packages (not the app bundles they were made from).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: linux-*
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: windows-*
          merge-multiple: true
      - name: Release notes
        run: |
          # This version's section of CHANGELOG.md, then where to read more.
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          **Downloads:** Windows: `*-windows-x64-setup.exe` or `*-windows-arm64-setup.exe` (ARM PCs).
          Linux: `.deb` (Debian, Ubuntu), `.rpm` (Fedora) or the `.tar.gz` with `install.sh`.
          The `-symbols`/`-debug` files are only needed to read crash reports. Check downloads
          against `SHA256SUMS`. Supported systems and known limitations:
          [docs/PLATFORMS.md](https://github.com/ichbinstudent/deepwork/blob/main/docs/PLATFORMS.md).
          EOF
          sed -i 's/^          //' notes.md
          cat notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      # Signed build provenance (Sigstore), checkable with `gh attestation
      # verify`. Free for public repositories only.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags like v0.2.0-rc.1 are release candidates.
          pre=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" $pre \
            --draft --title "DeepWork ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
