name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch ships current GTK 4 and libadwaita (>= 1.7), which Ubuntu runners don't yet.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita rustup
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        # The version in rust-toolchain.toml.
        run: rustup default stable && rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The Linux packages (tarball, .deb, .rpm), built on the oldest supported
  # system (Debian 13), checked with lintian and the desktop validators.
  linux-packages:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev-bin curl ca-certificates git python3 \
            lintian desktop-file-utils appstream
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        env:
          PACKAGE_MAINTAINER: ${{ vars.PACKAGE_MAINTAINER }}
        run: .github/scripts/package-linux.sh target/release dist
      - name: Lint
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml
          # bogus-mail-host: until the PACKAGE_MAINTAINER variable is set.
          lintian --fail-on error --suppress-tags bogus-mail-host,mail-address-loops-or-bounces --info dist/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: dist

  # Install, use, update and remove each package on a clean system.
  linux-package-test:
    needs: linux-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            package: "*.deb"
          - image: fedora:42
            package: "*.rpm"
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages
          path: dist
      - name: Test the package
        run: .github/scripts/linux-package-test.sh dist/${{ matrix.package }}
      - name: rpmlint
        if: matrix.image == 'fedora:42'
        run: dnf install -y -q rpmlint && rpmlint dist/*.rpm

  # The release binaries (built on the oldest supported system) on the newest
  # libraries.
  linux-newest:
    needs: linux-packages
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages
          path: dist
      - name: Run the programs
        run: |
          pacman -Syu --noconfirm --needed gtk4 libadwaita
          tar -xzf dist/deepwork-*-linux-x86_64.tar.gz
          for p in deepwork deepwork-daemon deepworkctl; do deepwork-*/bin/$p --version; done

  # Security advisories, licenses and sources of all dependencies.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        env:
          # The action brings its own Rust; don't ask for rust-toolchain.toml's.
          RUSTUP_TOOLCHAIN: stable
        with:
          command: check advisories licenses sources bans

  # The service and core on the other platforms (no GUI there yet).
  portable:
    strategy:
      fail-fast: false
      matrix:
        # macOS is off while the repository is private (its runners use
        # minutes 10x as fast). Add macos-latest back to re-enable it.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy
        run: cargo clippy -p deepwork-core -p deepwork-daemon --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p deepwork-core -p deepwork-daemon --locked
      - name: Check PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = $false
          foreach ($f in Get-ChildItem .github/scripts/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad = $true }
            # Windows PowerShell 5.1 reads scripts without a BOM as ANSI.
            if ((Get-Content $f -Raw -Encoding UTF8) -match '[^\x00-\x7F]') {
              Write-Host "$($f.Name): use ASCII only (Windows PowerShell misreads other characters)"; $bad = $true
            }
          }
          if ($bad) { exit 1 }
      # Windows on ARM: compile-checked from the x64 runner (ARM runners
      # are only free for public repositories).
      - name: Clippy (Windows on ARM)
        if: runner.os == 'Windows'
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo clippy --target aarch64-pc-windows-msvc -p deepwork-core -p deepwork-daemon --all-targets --locked -- -D warnings

  # The GTK app for Windows (built with MSYS2, natively for x64 and ARM64),
  # the installer, then an end-to-end test of it: install, block, check,
  # update, uninstall, with screenshots.
  windows-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: UCRT64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          pacboy: >-
            cc:p pkgconf:p rust:p gtk4:p libadwaita:p librsvg:p adwaita-icon-theme:p
      # The app's dependencies take minutes to build; keep them between runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target-gnu
            .cargo-gnu
          key: app-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: app-${{ matrix.arch }}-
      - name: Build and bundle the app
        shell: msys2 {0}
        env:
          CARGO_TARGET_DIR: target-gnu
          CARGO_HOME: ${{ github.workspace }}/.cargo-gnu
        run: |
          cargo build --release --locked -p deepwork
          .github/scripts/bundle-windows-app.sh app-bundle
      - name: Install Rust
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-toolchain none
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
          }
          rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.arch }}
      - name: Build the service
        run: cargo build --release --locked -p deepwork-daemon
      # Exercise the signing path with a throwaway self-signed certificate
      # (releases use the real one from the repository secrets).
      - name: Test certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=DeepWork CI test' -CertStoreLocation Cert:\CurrentUser\My
          $pw = [guid]::NewGuid().ToString()
          $file = Join-Path $env:RUNNER_TEMP 'ci.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $file -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          "WINDOWS_SIGN_PFX=$([Convert]::ToBase64String([IO.File]::ReadAllBytes($file)))" >> $env:GITHUB_ENV
          "WINDOWS_SIGN_PASSWORD=$pw" >> $env:GITHUB_ENV
      - name: Build the installer
        shell: pwsh
        run: ./.github/scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Bin target/release -App app-bundle -Out dist
      - name: End-to-end test
        shell: pwsh
        run: ./.github/scripts/windows-e2e.ps1 -Setup (Get-Item dist/*-setup.exe).FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-e2e-${{ matrix.arch }}
          path: ${{ runner.temp }}/shots
