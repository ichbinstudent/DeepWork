name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch ships current GTK 4 and libadwaita (>= 1.7), which Ubuntu runners don't yet.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita rustup
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup default stable && rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The service and core on the other platforms (no GUI there yet).
  portable:
    strategy:
      fail-fast: false
      matrix:
        # macOS is off while the repository is private (its runners use
        # minutes 10x as fast). Add macos-latest back to re-enable it.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add clippy
      - name: Clippy
        run: cargo clippy -p deepwork-core -p deepwork-daemon --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p deepwork-core -p deepwork-daemon --locked
      - name: Check PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = $false
          foreach ($f in Get-ChildItem windows/*.ps1, .github/scripts/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad = $true }
          }
          if ($bad) { exit 1 }
      # Windows on ARM: compile-checked from the x64 runner (ARM runners
      # are only free for public repositories).
      - name: Clippy (Windows on ARM)
        if: runner.os == 'Windows'
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo clippy --target aarch64-pc-windows-msvc -p deepwork-core -p deepwork-daemon --all-targets --locked -- -D warnings

  # The GTK app for Windows (built with MSYS2), then an end-to-end test of
  # the whole package: install, block, check, uninstall, with screenshots.
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg mingw-w64-ucrt-x86_64-adwaita-icon-theme
      - name: Build and bundle the app
        shell: msys2 {0}
        env:
          CARGO_TARGET_DIR: target-gnu
        run: |
          cargo build --release --locked -p deepwork
          .github/scripts/bundle-windows-app.sh app-bundle
      - name: Build the service
        run: cargo build --release --locked -p deepwork-daemon
      - name: End-to-end test
        shell: pwsh
        run: ./.github/scripts/windows-e2e.ps1 -App app-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-app-screenshots
          path: ${{ runner.temp }}/shots
