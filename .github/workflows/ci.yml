name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch ships current GTK 4 and libadwaita (>= 1.7), which Ubuntu runners don't yet.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita rustup
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup default stable && rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The service and core on the other platforms (no GUI there yet).
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add clippy
      - name: Clippy
        run: cargo clippy -p deepwork-core -p deepwork-daemon --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p deepwork-core -p deepwork-daemon --locked
